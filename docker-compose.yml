services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/nexgene.db
      SECRET_KEY: ${SECRET_KEY:-nexgene-local-development-secret-only}
      DEV_MODE: ${DEV_MODE:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8000:8000"
    volumes:
      - nexgene_data:/data
    restart: unless-stopped
volumes:
  nexgene_data:
