services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app/backend
      - ./mobile:/app/mobile
      - nexgene_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/nexgene.db
      - SECRET_KEY=nexgene-v0.7.1-dev-secret-change-me
    command: sh -c "pip install --no-cache-dir -r backend/requirements.txt && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
volumes:
  nexgene_data:
