name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        env:
          TESTING: "1"
          DATABASE_URL: sqlite:////tmp/nexgene_ci.db
          CLINICAL_DATABASE_URL: sqlite:////tmp/nexgene_clinical_ci.db
          CLINICAL_PROVIDER_KEY: test-provider-key
          DEV_MODE: "true"
        run: python -m pytest backend/tests/ -v --tb=short
