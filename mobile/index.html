<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>NexGene</title><link rel="stylesheet" href="/static/styles.css"/></head><body>
<div id="toast" class="toast hidden"></div>
<section id="auth-panel" class="panel">
  <h1>NexGene</h1>
  <p class="tagline">Your personal health signal — lifestyle first.</p>
  <label>Email <input id="email" type="email" autocomplete="username"/></label>
  <label>Password <input id="password" type="password" autocomplete="current-password"/></label>
  <div class="row">
    <button id="btn-login">Sign in</button>
    <button id="btn-register" class="secondary">Create account</button>
  </div>
  <p class="hint">Password: 12+ chars with upper, lower, number, symbol.</p>
</section>
<section id="app-panel" class="panel hidden">
  <header>
    <h1>NexGene</h1>
    <div><span id="user-email"></span> <button id="btn-logout" class="link">Sign out</button></div>
  </header>
  <div class="grid">
    <div class="card" data-period="morning">
      <h2>Morning</h2>
      <label>Sleep hours <input data-kind="sleep_duration" type="number" step="0.1" min="0" max="24"/></label>
      <label>Sleep quality <input data-kind="sleep_quality" type="number" min="1" max="10"/></label>
      <label>Energy <input data-kind="energy" type="number" min="1" max="10"/></label>
      <label>Mood <input data-kind="mood" type="number" min="1" max="10"/></label>
      <button id="btn-morning">Save morning</button>
    </div>
    <div class="card" data-period="evening">
      <h2>Evening</h2>
      <label>Stress <input data-kind="stress" type="number" min="1" max="10"/></label>
      <label>Focus <input data-kind="focus" type="number" min="1" max="10"/></label>
      <label>Energy <input data-kind="energy" type="number" min="1" max="10"/></label>
      <label>Activity level <input data-kind="activity_level" type="number" min="1" max="10"/></label>
      <label>Diet quality <input data-kind="diet_quality" type="number" min="1" max="10"/></label>
      <label>Nicotine <input data-kind="nicotine" type="text" placeholder="none / light / ..."/></label>
      <button id="btn-evening">Save evening</button>
    </div>
  </div>
  <div class="card"><h2>Today</h2><div id="today-summary"></div></div>
  <div class="card"><h2>Patterns (30d)</h2><div id="patterns-box"></div></div>
  <div class="card"><h2>Insights</h2><div id="insights-box"></div></div>
</section>
<script src="/static/app.js"></script>
</body></html>
